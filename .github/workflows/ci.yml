name: CampusFlow checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: campusflow_test
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U campusflow" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip==26.3 setuptools==84.1.0
      - run: pip install -r requirements-dev.txt
      - run: pytest backend/tests -q
      - run: pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://campusflow:ci-only-password@localhost:5432/campusflow_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: docker build -t campusflow:ci .
