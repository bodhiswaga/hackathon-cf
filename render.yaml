services:
  - type: web
    name: campusflow
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DATA
        value: "true"
      - key: CAMPUS_TIMEZONE
        value: Asia/Yekaterinburg
databases:
  - name: campusflow-db
    plan: free
    region: frankfurt
    databaseName: campusflow
    user: campusflow
