services:
  - type: web
    name: campusflow
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/campusflow-demo.db
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DATA
        value: "true"
      - key: CAMPUS_TIMEZONE
        value: Asia/Yekaterinburg
