services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: local-campus-password
    volumes:
      - campus-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      GOOGLE_MAIL_URL: ${GOOGLE_MAIL_URL:-}
      GOOGLE_MAIL_SECRET: ${GOOGLE_MAIL_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      NOTIFICATIONS_JOB_SECRET: ${NOTIFICATIONS_JOB_SECRET:-}
      DATABASE_URL: postgresql+psycopg://campusflow:local-campus-password@db/campusflow
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-for-deployment}
      SEED_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
volumes:
  campus-data:
