# Free hosting of the production application configuration. See README limits.
services:
  - type: web
    name: campusflow-production
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    dockerCommand: python -m backend.launch
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-production-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: BOOTSTRAP_ADMIN_LOGIN
        value: operator
      - key: BOOTSTRAP_ADMIN_NAME
        value: Администратор кампуса
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: REGISTRATION_MODE
        value: invite
      - key: REGISTRATION_INVITE_CODE
        generateValue: true
      - key: CAMPUS_TIMEZONE
        value: Asia/Yekaterinburg
      - key: FORWARDED_ALLOW_IPS
        value: "*"
databases:
  - name: campusflow-production-db
    plan: free
    region: frankfurt
    databaseName: campusflow
    user: campusflow
    postgresMajorVersion: "17"
    ipAllowList: []
